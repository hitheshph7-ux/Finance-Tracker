<!DOCTYPE html>
<html>

<head>
    <title>Edit Profile</title>
    <link rel="stylesheet" href="edit_profile.css">
</head>

<body>

    <div class="profile">

        <h1>My Profile</h1>

        <input type="text" id="name" placeholder="Enter your name">

        <input type="email" id="email" placeholder="Enter your email">

        <input type="tel" id="phone" placeholder="Enter your phone number">

        <input type="text" id="occupation" placeholder="Enter your occupation">

        <input type="number" id="income" placeholder="Enter your monthly income">

        <button onclick="saveProfile()">Save Profile</button>
        <br>
        <button onclick="window.location.href='../profile/profile.html'" style="background-color: #555555; margin-top: 10px;">Cancel</button>

    </div>
    
    <script src="edit_profile.js"></script>

</body>

</html>
